# Sthyra CRM Phase 1.b/c + Phase 2 — INTEGRATION stack
#
# Brings up the full local stack:
#   - Postgres 16 with capture-service + field-service migrations
#   - Redis 7
#   - capture-service (port 9090)
#   - field-service  (port 9091)
#
# Usage:
#   docker-compose -f docker-compose.integration.yml up -d --build
#   docker-compose -f docker-compose.integration.yml down -v
#
# Test:
#   curl http://localhost:9090/v1/health
#   curl http://localhost:9091/v1/health

services:
  postgres:
    image: postgres:16-alpine
    container_name: sthyra-crm-postgres-int
    environment:
      POSTGRES_USER: sthyra_crm
      POSTGRES_PASSWORD: sthyra_crm_dev_password
      POSTGRES_DB: sthyra_crm
    ports:
      - "5432:5432"
    volumes:
      - sthyra-crm-pg-data-int:/var/lib/postgresql/data
      - ./services/capture-service/migrations/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./services/field-service/migrations/001-init.sql:/docker-entrypoint-initdb.d/002-field-init.sql:ro
      - ./services/bim-viewer-service/migrations/001-init.sql:/docker-entrypoint-initdb.d/003-bim-init.sql:ro
      - ./services/field-service/migrations/001-init.sql:/docker-entrypoint-initdb.d/002-field-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sthyra_crm -d sthyra_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sthyra-crm-redis-int
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  capture-service:
    build:
      context: .
      dockerfile: services/capture-service/Dockerfile
    container_name: sthyra-crm-capture-int
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      REDIS_URL: redis://redis:6379
      STHYRA_CRM_STORAGE: local
      STHYRA_CRM_STORAGE_ROOT: /var/lib/sthyra-crm/storage
      PORT: "9090"
      HOST: "0.0.0.0"
    ports:
      - "9090:9090"
    volumes:
      - sthyra-crm-storage-int:/var/lib/sthyra-crm/storage

  field-service:
    build:
      context: .
      dockerfile: services/field-service/Dockerfile
    container_name: sthyra-crm-field-int
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      PORT: "9091"
      HOST: "0.0.0.0"
    ports:
      - "9091:9091"

  field-service:
    build:
      context: .
      dockerfile: services/field-service/Dockerfile
    container_name: sthyra-crm-field-int
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      PORT: "9091"
      HOST: "0.0.0.0"
    ports:
      - "9091:9091"

  bim-viewer-service:
    build:
      context: .
      dockerfile: services/bim-viewer-service/Dockerfile
    container_name: sthyra-crm-bim-int
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      PORT: "9092"
      HOST: "0.0.0.0"
    ports:
      - "9092:9092"


  ai-copilot-service:
    build:
      context: .
      dockerfile: services/ai-copilot-service/Dockerfile
    container_name: sthyra-crm-copilot-int
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      CAPTURE_SERVICE_URL: http://capture-service:9090
      FIELD_SERVICE_URL: http://field-service:9091
      BIM_VIEWER_SERVICE_URL: http://bim-viewer-service:9092
      PORT: "9093"
      HOST: "0.0.0.0"
    ports:
      - "9093:9093"


  mobile-bff-service:
    build:
      context: .
      dockerfile: services/mobile-bff-service/Dockerfile
    container_name: sthyra-crm-mobile-int
    depends_on:
      postgres:
        condition: service_healthy
      capture-service:
        condition: service_started
      field-service:
        condition: service_started
      bim-viewer-service:
        condition: service_started
      ai-copilot-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      MOBILE_JWT_SECRET: sthyra-crm-mobile-jwt-secret-32b-padded
      CAPTURE_SERVICE_URL: http://capture-service:9090
      FIELD_SERVICE_URL: http://field-service:9091
      BIM_VIEWER_SERVICE_URL: http://bim-viewer-service:9092
      AI_COPILOT_SERVICE_URL: http://ai-copilot-service:9093
      PORT: "9094"
      HOST: "0.0.0.0"
    ports:
      - "9094:9094"


  track-service:
    build:
      context: .
      dockerfile: services/track-service/Dockerfile
    container_name: sthyra-crm-track-int
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      PORT: "9095"
      HOST: "0.0.0.0"
    ports:
      - "9095:9095"


  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    container_name: sthyra-crm-report-int
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      PORT: "9096"
      HOST: "0.0.0.0"
    ports:
      - "9096:9096"


  workflow-service:
    build:
      context: .
      dockerfile: services/workflow-service/Dockerfile
    container_name: sthyra-crm-workflow-int
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      WORKFLOW_SERVICE_TOKEN: sthyra-crm-workflow-service-token
      PORT: "9097"
      HOST: "0.0.0.0"
    ports:
      - "9097:9097"


  integration-service:
    build:
      context: .
      dockerfile: services/integration-service/Dockerfile
    container_name: sthyra-crm-integration-int
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sthyra_crm:sthyra_crm_dev_password@postgres:5432/sthyra_crm
      PORT: "9098"
      HOST: "0.0.0.0"
    ports:
      - "9098:9098"


volumes:
  sthyra-crm-pg-data-int:
    driver: local
  sthyra-crm-storage-int:
    driver: local
