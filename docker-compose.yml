name: sthyra-crm

# Local dev stack for Sthyra CRM. Brings up Postgres 16 with the pg_trgm extension.
# Usage:
#   docker compose up -d
#   DATABASE_URL=postgres://sthyra-crm:sthyra-crm@localhost:5432/sthyra-crm \
#     pnpm --filter=@sthyra-crm/org-service start:pg
#
# Destructive: destroys the named volume on `docker compose down -v`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sthyra-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sthyra-crm
      POSTGRES_PASSWORD: sthyra-crm
      POSTGRES_DB: sthyra-crm
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - sthyra-crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sthyra-crm -d sthyra-crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for inspecting the DB during development.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sthyra-crm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sthyra-crm.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    profiles: ["tools"]   # opt-in: `docker compose --profile tools up`

volumes:
  sthyra-crm-pgdata:
