name: plumb

# Local dev stack for Plumb. Brings up Postgres 16 with the pg_trgm extension.
# Usage:
#   docker compose up -d
#   DATABASE_URL=postgres://plumb:plumb@localhost:5432/plumb \
#     pnpm --filter=@plumb/org-service start:pg
#
# Destructive: destroys the named volume on `docker compose down -v`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: plumb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plumb
      POSTGRES_PASSWORD: plumb
      POSTGRES_DB: plumb
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - plumb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumb -d plumb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for inspecting the DB during development.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: plumb-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@plumb.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    profiles: ["tools"]   # opt-in: `docker compose --profile tools up`

volumes:
  plumb-pgdata:
